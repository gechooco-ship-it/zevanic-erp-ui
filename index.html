<!DOCTYPE html>
<html lang="id">

  <title>ZEVANIC HOUSE - ERP System</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800 overflow-hidden">

      <div class="text-center mb-8">
        <h1 class="text-3xl font-black tracking-tight text-gray-900">ZEVANIC HOUSE</h1>
        <p class="text-xs tracking-widest text-gray-500 font-bold uppercase mt-1">ERP System & Mgmt</p>
      </div>

      <div class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">Email Address</label>
          <div class="relative">
            <i class="far fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
            <input type="email" placeholder="admin@zevanic.com" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm">
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-3.5 text-gray-400"></i>
            <input type="password" value="12345678" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm">
          </div>
        </div>
        
        <button onclick="pindahLayar('screen-camera')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 mt-4 flex items-center justify-center">
          Login & Mulai Shift <i class="fas fa-arrow-right ml-2"></i>
        </button>
      </div>
    </div>
  </div>
