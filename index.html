<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEVANIC HOUSE - ERP System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800">

  <div id="screen-login" class="min-h-screen flex flex-col items-center justify-center p-4 fade-in overflow-y-auto">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-gray-100 my-6">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-black tracking-tight text-gray-900">ZEVANIC HOUSE</h1>
        <p class="text-xs tracking-widest text-gray-500 font-bold uppercase mt-1">ERP System & Mgmt</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Email / Akun Login</label>
          <div class="relative">
            <i class="far fa-envelope absolute left-4 top-3 text-gray-400"></i>
            <input type="email" id="input-email" placeholder="contoh@zevanic.com" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-3 text-gray-400"></i>
            <input type="password" id="input-pass" placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm">
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="check-ingat" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4">
            <span class="text-gray-600 font-medium">Ingatkan Saya</span>
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Status Kehadiran / Pengajuan</label>
          <select id="pilihan-status" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm font-medium text-gray-700">
            <option value="HADIR (CLOCK IN)">🟢 Hadir (Clock In)</option>
            <option value="IZIN">🟡 Pengajuan Izin (Hari H)</option>
            <option value="CUTI">🔵 Pengajuan Cuti (Min H-3)</option>
          </select>
        </div>

        <button onclick="prosesLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 mt-2 flex items-center justify-center text-sm">
          Login <i class="fas fa-arrow-right ml-2"></i>
        </button>

        <div class="text-center pt-3 border-t border-gray-100">
          <p class="text-xs text-gray-500">Belum punya akun?</p>
          <button onclick="bukaFormRegistrasi()" class="mt-1.5 text-blue-600 font-bold text-xs hover:underline flex items-center justify-center w-full">
            <i class="fas fa-user-plus mr-1.5"></i> Daftar Akun Baru (Registrasi)
          </button>
        </div>
      </div>
    </div>
  </div>


  <div id="screen-register" class="hidden h-auto min-h-screen w-full bg-slate-50 flex flex-col items-center justify-start p-4 py-10 fade-in overflow-y-auto">
    <div class="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border border-gray-100 my-auto">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <div>
          <h2 class="text-xl font-black text-gray-900">Formulir Pendaftaran Karyawan</h2>
          <p class="text-xs text-gray-500">Sesuai standar operasional Zevanic ERP</p>
        </div>
        <button onclick="pindahLayar('screen-login')" class="text-gray-400 hover:text-gray-600 text-sm font-bold"><i class="fas fa-times text-lg"></i></button>
      </div>

      <div class="space-y-4 text-xs">
        <div class="grid grid-cols-2 gap-4 bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
          <div>
            <label class="block font-bold text-blue-800 mb-1">ID Karyawan (Auto)</label>
            <input type="text" id="reg-id" readonly class="w-full px-3 py-2 bg-white border border-blue-200 rounded-xl font-mono text-gray-600">
          </div>
          <div>
            <label class="block font-bold text-blue-800 mb-1">ID APP (Auto)</label>
            <input type="text" id="reg-idapp" readonly class="w-full px-3 py-2 bg-white border border-blue-200 rounded-xl font-mono text-gray-600">
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <h3 class="font-bold text-gray-900 text-sm border-b pb-1"><i class="fas fa-id-card text-blue-600 mr-2"></i> Data Identitas & Personal</h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block font-semibold text-gray-600 mb-1">Nama Lengkap (Sesuai KTP) *</label>
              <input type="text" id="reg-nama" placeholder="Nama lengkap" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block font-semibold text-gray-600 mb-1">NIK KTP (16 Angka) *</label>
              <input type="text" id="reg-nik" maxlength="16" placeholder="3204xxxxxxxxxxxx" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block font-semibold text-gray-600 mb-1">Jenis Kelamin *</label>
              <select id="reg-gender" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none">
                <option value="Pria">Pria</option>
                <option value="Wanita">Wanita</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-gray-600 mb-1">Tempat Lahir *</label>
              <input type="text" id="reg-tempatlahir" placeholder="Kota Kelahiran" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none">
            </div>
            <div>
              <label class="block font-semibold text-gray-600 mb-1">Tanggal Lahir *</label>
              <input type="date" id="reg-tgl" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none">
            </div>
          </div>
          <div>
            <label class="block font-semibold text-gray-600 mb-1">Upload Foto KTP (Wajib) *</label>
            <div class="flex items-center space-x-3">
              <input type="file" id="reg-ktpfile" accept="image/*" onchange="previewKTP(event)" class="text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
              <img id="preview-ktp-img" class="w-12 h-12 object-cover rounded-lg border hidden shadow-sm" />
            </div>
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <h3 class="font-bold text-gray-900 text-sm border-b pb-1"><i class="fas fa-map-marker-alt text-blue-600 mr-2"></i> Kontak & Domisili</h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block font-semibold text-gray-600 mb-1">Email Aktif (Untuk Login) *</label>
              <input type="email" id="reg-email" placeholder="email@zevanic.com" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none">
            </div>
            <div>
              <label class="block font-semibold text-gray-600 mb-1">No. HP / WhatsApp (Verifikasi OTP) *</label>
              <input type="text" id="reg-hp" placeholder="08xxxxxxxxxx" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none">
            </div>
          </div>
          <div class="p-3 bg-gray-50 rounded-2xl border space-y-2">
            <span class="font-bold text-gray-700">Alamat Tempat Tinggal Sekarang</span>
            <div class="grid grid-cols-2 gap-2">
              <select id="reg-tinggal-kab" onchange="updateKecamatanTinggal()" class="px-3 py-2 bg-white border rounded-xl">
                <option value="Bandung">Kab. Bandung</option>
                <option value="Bandung Barat">Kab. Bandung Barat</option>
                <option value="Cimahi">Kota Cimahi</option>
                <option value="Garut">Kab. Garut</option>
              </select>
              <select id="reg-tinggal-kec" class="px-3 py-2 bg-white border rounded-xl"></select>
            </div>
            <input type="text" id="reg-tinggal-detail" placeholder="Nama Jalan, RT/RW, No. Rumah" class="w-full px-3 py-2 bg-white border rounded-xl">
          </div>
          <div class="p-3 bg-gray-50 rounded-2xl border space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-gray-700">Alamat Sesuai KTP</span>
              <label class="flex items-center space-x-1 cursor-pointer text-[11px] text-blue-600 font-semibold">
                <input type="checkbox" id="check-sama-alamat" onchange="salinAlamat()" class="rounded">
                <span>Sama dengan tempat tinggal</span>
              </label>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <select id="reg-ktp-kab" onchange="updateKecamatanKTP()" class="px-3 py-2 bg-white border rounded-xl">
                <option value="Bandung">Kab. Bandung</option>
                <option value="Bandung Barat">Kab. Bandung Barat</option>
                <option value="Cimahi">Kota Cimahi</option>
                <option value="Garut">Kab. Garut</option>
              </select>
              <select id="reg-ktp-kec" class="px-3 py-2 bg-white border rounded-xl"></select>
            </div>
            <input type="text" id="reg-ktp-detail" placeholder="Nama Jalan, RT/RW, No. Rumah" class="w-full px-3 py-2 bg-white border rounded-xl">
