<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEVANIC HOUSE - Responsive ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-gray-800 overflow-hidden">

  <div class="flex h-screen w-full relative">

    <aside class="hidden md:flex w-64 bg-white border-r border-gray-200 flex-col shadow-sm z-20">
      <div class="h-20 flex flex-col justify-center px-6 border-b border-gray-100">
        <h1 class="text-xl font-black tracking-tight text-gray-900">ZEVANIC HOUSE</h1>
        <p class="text-[9px] tracking-widest text-gray-500 font-bold uppercase mt-0.5">ERP System & Mgmt</p>
      </div>
      
      <nav class="flex-1 px-4 py-6 space-y-2">
        <button class="w-full flex items-center px-4 py-3 text-sm font-bold rounded-xl bg-blue-50 text-blue-600 transition">
          <i class="fas fa-home w-6 text-left"></i> Dashboard
        </button>
        <button class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl text-gray-500 hover:bg-gray-50 transition">
          <i class="far fa-clock w-6 text-left"></i> History
        </button>
        <button class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl text-gray-500 hover:bg-gray-50 transition">
          <i class="far fa-calendar-alt w-6 text-left"></i> Schedule
        </button>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button class="w-full flex items-center px-4 py-2 text-sm font-medium rounded-xl text-gray-500 hover:bg-gray-50 transition">
          <i class="far fa-user w-6 text-left"></i> Profile
        </button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col relative h-full">

      <header class="h-20 bg-white flex items-center justify-between px-6 md:px-10 z-10 shadow-sm md:shadow-none border-b border-gray-200">
        <div>
          <div class="text-[10px] md:text-xs font-bold text-blue-600 uppercase tracking-wider flex items-center mb-0.5 md:mb-1">
            <i class="far fa-clock mr-1.5"></i> CLOCKIN SYSTEM
          </div>
          <h2 class="text-lg md:text-2xl font-bold text-gray-900 leading-tight">Hi, Ahmad</h2>
        </div>

        <div class="flex items-center space-x-3 md:space-x-6">
          <span id="badge-status" class="bg-red-50 text-red-500 border border-red-100 px-3 py-1 md:px-4 md:py-1.5 rounded-full text-[10px] md:text-xs font-bold tracking-wide flex items-center">
            <span class="w-1.5 h-1.5 md:w-2 md:h-2 bg-red-500 rounded-full mr-1.5 md:mr-2 animate-pulse"></span> 
            <span class="hidden md:inline">NOT CLOCKED IN</span>
            <span class="md:hidden">OFF DUTY</span>
          </span>
          <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-blue-100 text-blue-600 font-bold flex items-center justify-center border border-blue-200 shadow-sm text-sm md:text-lg">
            A
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-4 md:p-10 pb-24 md:pb-10 flex flex-col xl:flex-row gap-6 md:gap-8 items-start">
        
        <div class="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center justify-center w-full xl:w-1/3 min-h-[400px] md:min-h-[450px]">
          
          <div class="text-center mb-6 md:mb-8">
            <div class="text-3xl md:text-4xl font-black text-gray-800 tracking-tight mb-1 md:mb-2">08:30:15 <span class="text-lg md:text-xl font-semibold text-gray-400">AM</span></div>
            <p class="text-xs md:text-sm text-gray-500 font-medium"><i class="far fa-calendar mr-1.5"></i> Thu, Oct 12, 2026</p>
          </div>

          <button onclick="toggleClockIn()" id="btn-main-clock" class="w-48 h-48 md:w-56 md:h-56 rounded-full bg-blue-600 text-white flex flex-col items-center justify-center shadow-xl shadow-blue-200 hover:scale-105 transition-transform duration-300 border-[8px] md:border-[10px] border-blue-50 active:scale-95 mb-6 md:mb-8">
            <i id="icon-clock" class="fas fa-hand-pointer text-3xl md:text-4xl mb-1 md:mb-2"></i>
            <span class="text-[10px] md:text-xs tracking-widest uppercase font-semibold opacity-90">TAP TO</span>
            <span id="text-clock-action" class="font-black text-xl md:text-2xl tracking-wide mt-1">CLOCK IN</span>
          </button>

          <div class="grid grid-cols-2 gap-3 md:gap-4 w-full">
            <button class="bg-slate-50 border border-gray-200 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold text-gray-600 flex items-center justify-center hover:bg-gray-100 transition">
              <i class="fas fa-mug-hot text-gray-400 mr-1.5 md:mr-2"></i> Break
            </button>
            <button class="bg-slate-50 border border-gray-200 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold text-gray-600 flex items-center justify-center hover:bg-gray-100 transition">
              <i class="far fa-file-alt text-gray-400 mr-1.5 md:mr-2"></i> Time Off
            </button>
          </div>
        </div>

        <div class="w-full xl:w-2/3 space-y-6 md:space-y-8">
          <div>
            <h3 class="text-base md:text-lg font-bold text-gray-800 mb-3 md:mb-4">Today's Summary</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
              
              <div class="bg-white p-5 md:p-6 rounded-2xl border border-gray-100 shadow-sm">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                  <div class="p-2.5 md:p-3 bg-blue-50 text-blue-600 rounded-lg"><i class="far fa-clock text-lg md:text-xl"></i></div>
                  <span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-[10px] md:text-xs font-semibold">Today</span>
                </div>
                <p class="text-xs md:text-sm font-medium text-gray-500 mb-1">Total Hours Logged</p>
                <p id="val-today" class="text-2xl md:text-3xl font-black text-gray-800">0h 0m</p>
                <div class="w-full bg-gray-100 rounded-full h-1.5 md:h-2 mt-3 md:mt-4">
                  <div id="bar-today" class="bg-blue-600 h-1.5 md:h-2 rounded-full" style="width: 0%"></div>
                </div>
                <p class="text-[10px] md:text-xs text-gray-400 mt-2 font-medium">Scheduled: 8h 0m</p>
              </div>

              <div class="bg-white p-5 md:p-6 rounded-2xl border border-gray-100 shadow-sm">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                  <div class="p-2.5 md:p-3 bg-indigo-50 text-indigo-600 rounded-lg"><i class="fas fa-chart-line text-lg md:text-xl"></i></div>
                  <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-[10px] md:text-xs font-semibold">This Week</span>
                </div>
                <p class="text-xs md:text-sm font-medium text-gray-500 mb-1">Weekly Progress</p>
                <p class="text-2xl md:text-3xl font-black text-indigo-600">34h 15m</p>
                <div class="w-full bg-gray-100 rounded-full h-1.5 md:h-2 mt-3 md:mt-4">
                  <div class="bg-indigo-500 h-1.5 md:h-2 rounded-full" style="width: 85%"></div>
                </div>
                <p class="text-[10px] md:text-xs text-gray-400 mt-2 font-medium">Target: 40h 0m</p>
              </div>

            </div>
          </div>
        </div>

      </main>
    </div>

    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-end p-2 pb-4 z-50 rounded-t-2xl shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.1)]">
      
      <button class="flex flex-col items-center p-2 text-blue-600 transition-colors w-20 mb-1">
        <i class="fas fa-home text-xl mb-1"></i>
        <span class="text-[10px] font-bold">Home</span>
      </button>

      <button class="flex flex-col items-center relative -top-5 group">
        <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg shadow-blue-300 border-4 border-white group-hover:scale-105 group-active:scale-95 transition-transform">
          <i class="fas fa-qrcode text-2xl"></i>
        </div>
        <span class="text-[10px] font-bold text-gray-700 mt-1">Scan QR</span>
      </button>

      <button class="flex flex-col items-center p-2 text-gray-400 hover:text-blue-600 transition-colors w-20 mb-1">
        <i class="far fa-user text-xl mb-1"></i>
        <span class="text-[10px] font-bold">Profile</span>
      </button>

    </nav>

  </div>

  <script>
    let isClockedIn = false;
    function toggleClockIn() {
      const btn = document.getElementById('btn-main-clock');
      const textAction = document.getElementById('text-clock-action');
      const badge = document.getElementById('badge-status');
      const valToday = document.getElementById('val-today');
      const barToday = document.getElementById('bar-today');

      isClockedIn = !isClockedIn;

      if(isClockedIn) {
        // Mode On Duty
        btn.classList.replace('bg-blue-600', 'bg-emerald-500');
        btn.classList.replace('shadow-blue-200', 'shadow-emerald-200');
        btn.classList.replace('border-blue-50', 'border-emerald-50');
        textAction.innerText = "CLOCK OUT";
        
        badge.className = "bg-emerald-50 text-emerald-600 border border-emerald-100 px-3 py-1 md:px-4 md:py-1.5 rounded-full text-[10px] md:text-xs font-bold tracking-wide flex items-center";
        badge.innerHTML = '<span class="w-1.5 h-1.5 md:w-2 md:h-2 bg-emerald-500 rounded-full mr-1.5 md:mr-2 animate-pulse"></span> <span class="hidden md:inline">CLOCKED IN</span><span class="md:hidden">ON DUTY</span>';
        
        valToday.innerText = "0h 01m";
        barToday.style.width = "2%";
        barToday.classList.replace('bg-blue-600', 'bg-emerald-500');
      } else {
        // Mode Off Duty
        btn.classList.replace('bg-emerald-500', 'bg-blue-600');
        btn.classList.replace('shadow-emerald-200', 'shadow-blue-200');
        btn.classList.replace('border-emerald-50', 'border-blue-50');
        textAction.innerText = "CLOCK IN";

        badge.className = "bg-red-50 text-red-500 border border-red-100 px-3 py-1 md:px-4 md:py-1.5 rounded-full text-[10px] md:text-xs font-bold tracking-wide flex items-center";
        badge.innerHTML = '<span class="w-1.5 h-1.5 md:w-2 md:h-2 bg-red-500 rounded-full mr-1.5 md:mr-2 animate-pulse"></span> <span class="hidden md:inline">NOT CLOCKED IN</span><span class="md:hidden">OFF DUTY</span>';
        
        barToday.classList.replace('bg-emerald-500', 'bg-blue-600');
      }
    }
  </script>
</body>
</html>
