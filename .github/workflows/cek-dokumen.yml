name: Cek dokumen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan cek-dokumen.sh
        run: |
          set -e
          f=$(find . -name cek-dokumen.sh -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::warning::cek-dokumen.sh belum ada di repo — pemeriksaan dilewati."
            echo "Simpan cek-dokumen.sh di folder yang sama dengan STATUS-PROYEK.md."
            exit 0
          fi
          echo "Menjalankan $f"
          echo
          bash "$f"
